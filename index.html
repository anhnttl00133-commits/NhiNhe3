<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valentine Love</title>

<style>
body{
margin:0;
font-family:Arial;
background:linear-gradient(135deg,#ff9a9e,#fad0c4);
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:white;
text-align:center;
}

.page{
display:none;
flex-direction:column;
align-items:center;
gap:20px;
padding:20px;
animation:fade .6s ease;
}

.active{display:flex;}

@keyframes fade{
from{opacity:0;transform:scale(.95);}
to{opacity:1;transform:scale(1);}
}

/* button */
.nav-btn{
position:fixed;
right:20px;
bottom:20px;
width:90px;
height:90px;
border:none;
border-radius:50%;
background:linear-gradient(45deg,#ff4d6d,#ff8fab);
color:white;
cursor:pointer;
font-weight:bold;
box-shadow:0 8px 20px rgba(0,0,0,.35);
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
}

.nav-btn::before{
content:"❤";
font-size:28px;
}

/* page 1 */
.couple{display:flex;gap:25px;align-items:center;}

.person{
display:flex;
flex-direction:column;
align-items:center;
font-weight:bold;
}

.avatar{
width:90px;
height:90px;
border-radius:50%;
object-fit:cover;
border:4px solid white;
}

.heart{
width:110px;
height:110px;
background:#ff4d6d;
position:relative;
transform:rotate(-45deg);
animation:pulse 1.3s infinite;
}

.heart::before,
.heart::after{
content:"";
position:absolute;
width:110px;
height:110px;
background:#ff4d6d;
border-radius:50%;
}

.heart::before{top:-55px;}
.heart::after{left:55px;}

@keyframes pulse{
0%{transform:rotate(-45deg) scale(1);}
50%{transform:rotate(-45deg) scale(1.15);}
100%{transform:rotate(-45deg) scale(1);}
}

.days{font-weight:bold;margin-top:10px;}

/* floating hearts */
.floating-heart{
position:absolute;
bottom:-20px;
animation:floatUp linear forwards;
}

@keyframes floatUp{
to{transform:translateY(-110vh);opacity:0;}
}

/* page 2 */
.stage{
position:relative;
width:650px;
height:420px;
}

.photo{
position:absolute;
width:110px;
height:110px;
object-fit:cover;
border-radius:14px;
background:white;
padding:6px;
box-shadow:0 10px 20px rgba(0,0,0,.3);
}

/* page 3 */
.letter{
background:white;
color:#ff4d6d;
padding:15px;
border-radius:16px;
width:260px;
box-shadow:0 8px 20px rgba(0,0,0,.25);
}
</style>
</head>

<body>

<audio autoplay loop>
<source src="https://cdn.pixabay.com/audio/2022/02/23/audio_d1718ab41b.mp3">
</audio>

<!-- PAGE 1 -->
<div class="page active" id="page1">

<div class="couple">

<div class="person">
<img class="avatar" src="images/girl.jpg">
<div>Tên cô ấy</div>
</div>

<div>
<div class="heart"></div>
<div class="days" id="loveDays"></div>
</div>

<div class="person">
<img class="avatar" src="images/boy.jpg">
<div>Tên bạn</div>
</div>

</div>

<button class="nav-btn" onclick="nextPage()">Tiếp</button>

</div>

<!-- PAGE 2 -->
<div class="page" id="page2">

<div class="stage">

<!-- 👉 THAY ẢNH TẠI ĐÂY -->
<img class="https://github.com/anhnttl00133-commits/NhiNhe3/blob/main/anh1.jpg">
<img class="photo" src="https://github.com/anhnttl00133-commits/NhiNhe3/blob/main/anh2.jpg">
<img class="photo" src="https://github.com/anhnttl00133-commits/NhiNhe3/blob/main/anh3.jpg">
<img class="photo" src="https://github.com/anhnttl00133-commits/NhiNhe3/blob/main/anh4.jpg">
<img class="photo" src="https://github.com/anhnttl00133-commits/NhiNhe3/blob/main/anh5.jpg">

</div>

<button class="nav-btn" onclick="nextPage()">Tiếp</button>

</div>

<!-- PAGE 3 -->
<div class="page" id="page3">

<div class="letter">
<div id="typed"></div>
</div>

<button class="nav-btn" onclick="prevPage()">Lại</button>

</div>

<script>
let current=1;

function showPage(n){
document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
document.getElementById("page"+n).classList.add("active");
if(n===2)spread();
if(n===3)typeText();
}

function nextPage(){
current=current>=3?1:current+1;
showPage(current);
}

function prevPage(){
current=current<=1?3:current-1;
showPage(current);
}

/* love days */
const startDate=new Date("2024-01-01");
const days=Math.floor((new Date()-startDate)/86400000);
document.getElementById("loveDays").textContent=`❤️ ${days} ngày yêu ❤️`;

/* floating hearts */
setInterval(()=>{
const h=document.createElement("div");
h.className="floating-heart";
h.textContent="❤";
h.style.left=Math.random()*100+"vw";
h.style.animationDuration=(3+Math.random()*3)+"s";
document.body.appendChild(h);
setTimeout(()=>h.remove(),6000);
},600);

/* spread photos */
function spread(){
const photos=document.querySelectorAll(".photo");
const cols=3,gap=20;

photos.forEach((p,i)=>{
const row=Math.floor(i/cols);
const col=i%cols;
p.style.left=col*(130)+"px";
p.style.top=row*(130)+"px";
});
}

/* typing */
const msg="Chúc Nhi một ngày Valentine thật ngọt ngào ❤️";
let typed=false;

function typeText(){
if(typed)return;
typed=true;
const el=document.getElementById("typed");
let i=0;

const timer=setInterval(()=>{
el.textContent+=msg[i]||"";
i++;
if(i>=msg.length)clearInterval(timer);
},50);
}
</script>

</body>
</html>
